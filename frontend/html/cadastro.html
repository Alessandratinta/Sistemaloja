<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

<div class="login-container">
    <h1>Cadastro</h1>

    <form onsubmit="cadastrar(event)">
        <input type="text" id="novoUsuario" placeholder="Digite seu novo usuário" required>
        <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required>

        <button type="submit">Cadastrar</button>
    </form>

    <p>
        Já tem conta?
        <a href="/html/login.html">Voltar para login</a>
    </p>
</div>

<script src="../js/cadastro.js"></script>
</body>
</html>
