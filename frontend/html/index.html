<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema da Loja</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="login-container">
    <h1>Sistema da Loja</h1>

    <form onsubmit="entrar(event)">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha">

        <button type="submit">Entrar</button>
    </form>

    <p class="link-cadastro">
        Ainda não tem uma conta? <a href="cadastro.html">Cadastrar usuário</a>
    </p>
</div>

<script>
function entrar(event) {
    event.preventDefault();

    const usuarioDigitado = document.getElementById("usuario").value;
    const senhaDigitada = document.getElementById("senha").value;

    const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    const usuarioEncontrado = usuarios.find(
        user => user.usuario === usuarioDigitado && user.senha === senhaDigitada
    );

    if (usuarioEncontrado) {
        localStorage.setItem("usuarioLogado", usuarioDigitado);
        alert("Login realizado com sucesso!");
        window.location.href = "dashboard.html";
    } else {
        alert("Usuário ou senha inválidos.");
    }
}
</script>

</body>
</html>
