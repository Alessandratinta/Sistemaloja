<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema da Loja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1>Sistema da Loja</h1>

        <form onsubmit="entrar(event)">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <button type="submit">Entrar</button>
        </form>
    </div>

    <script>
        // Array para armazenar os usuários (em um sistema real, isso estaria no backend)
        const usuarios = [
          { usuario: "Ale", senha: "861667" },
          { usuario: "usuario1", senha: "senha456" }
        ];

        function entrar(event) {
          event.preventDefault(); // Evita o envio padrão do formulário

          const usuarioDigitado = document.getElementById("usuario").value;
          const senhaDigitada = document.getElementById("senha").value;

          // Procura o usuário no array
          const usuarioEncontrado = usuarios.find(user => user.usuario === usuarioDigitado && user.senha === senhaDigitada);

          if (usuarioEncontrado) {
            alert("Login realizado com sucesso!"); // Exibe um alerta de sucesso
            window.location.href = "dashboard.html"; // Redireciona para a página principal
          } else {
            alert("Usuário ou senha inválidos."); // Exibe um alerta de erro
          }
        }
    </script>
</body>
</html>
