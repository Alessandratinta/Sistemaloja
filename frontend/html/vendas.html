<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Vendas - Sistema da Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-container">

  <header class="dashboard-header">
    <h1>Nova Venda</h1>
    <a href="dashboard.html" class="btn-voltar">Voltar</a>
  </header>

  <form id="formVenda" class="produto-form">

    <label>Cliente</label>
    <input type="text" id="cliente" placeholder="Nome do cliente">

    <label>Produto</label>
    <input type="text" id="produto" placeholder="Produto vendido">

    <label>Valor</label>
    <input type="number" id="valor" step="0.01">

    <label>Forma de Pagamento</label>
    <select id="pagamento">
      <option value="">Selecione</option>
      <option>Dinheiro</option>
      <option>Cartão</option>
      <option>PIX</option>
    </select>

    <button type="submit">Salvar Venda</button>
  </form>

  <div class="produto-lista">
    <h2>Vendas Realizadas</h2>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Produto</th>
          <th>Valor</th>
          <th>Pagamento</th>
        </tr>
      </thead>
      <tbody id="listaVendas"></tbody>
    </table>
  </div>

</div>

<script src="vendas.js"></script>
</body>
</html>
