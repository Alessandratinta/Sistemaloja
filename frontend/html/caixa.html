<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Caixa - Sistema da Loja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-container">

  <header class="dashboard-header">
    <h1>Caixa</h1>
    <a href="dashboard.html" class="btn-voltar">Voltar</a>
  </header>

  <form id="formCaixa" class="produto-form">

    <label>Cliente</label>
    <input type="text" id="cliente" placeholder="Nome do cliente">

    <label>Produto</label>
    <select id="produto">
      <option value="">Selecione</option>
    </select>

    <label>Quantidade</label>
    <input type="number" id="quantidade" value="1">

    <label>Valor Unitário</label>
    <input type="number" id="valor" step="0.01" readonly>

    <label>Forma de Pagamento</label>
    <select id="pagamento">
      <option value="">Selecione</option>
      <option>Dinheiro</option>
      <option>PIX</option>
      <option>Cartão</option>
    </select>

    <button type="submit">Finalizar Venda</button>
  </form>

  <div class="produto-lista">
    <h2>Vendas do Dia</h2>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Produto</th>
          <th>Qtd</th>
          <th>Total</th>
          <th>Pagamento</th>
        </tr>
      </thead>
      <tbody id="listaCaixa"></tbody>
    </table>
  </div>

</div>

<script src="caixa.js"></script>
</body>
</html>
