<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Caixa PDV - Sistema da Loja</title>
  <link rel="stylesheet" href="../css/caixa.css">
</head>
<body class="pagina-caixa">

  <head>
  <meta charset="UTF-8">
  <title>Caixa</title>

  <!-- CSS PADRÃO DO SISTEMA -->
  <link rel="stylesheet" href="../css/global.css">

  <!-- CSS ESPECÍFICO DA PÁGINA (se precisar) -->
  <link rel="stylesheet" href="../css/caixa.css">
</head>
  <main class="caixa-container">

    <section class="vendas-dia">
      <div class="header-tabela">
        <h2>Itens da Venda</h2>
      </div>
      <div class="tabela-scroll">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Unitário</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody id="tabelaItens">
            </tbody>
        </table>
      </div>
    </section>

    <aside class="caixa-controles">
      
      <div class="caixa-form">
        <h2>Entrada de Itens</h2>
        
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" placeholder="Consumidor">

        <label for="produto">Produto</label>
        <select id="produto" onchange="preencherValor()">
          <option value="">Selecione um produto</option>
          </select>

        <div class="linha-dupla">
          <div>
            <label for="quantidade">Qtd</label>
            <input type="number" id="quantidade" value="1">
          </div>
          <div>
            <label for="valor">Valor Unitário</label>
            <input type="number" id="valor" step="0.01" readonly>
          </div>
        </div>

        <button type="button" class="btn-add" onclick="adicionarItem()">
          Adicionar Item (Enter)
        </button>
      </div>

      <div class="caixa-resumo">
        <div class="total-box">
          <small>TOTAL A PAGAR</small>
          <h3 id="totalVenda">R$ 0,00</h3>
        </div>

        <label for="formaPagamento">Forma de Pagamento</label>
        <select id="formaPagamento">
          <option value="">Selecione...</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão">Cartão</option>
          <option value="Pix">Pix</option>
        </select>

        <button class="btn-finalizar" onclick="finalizarVenda()">
          Finalizar Venda (F10)
        </button>
      </div>

    </aside>
  </main>

  <script src="../js/caixa.js"></script>
</body>
</html>
